services:
  study-flow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study_flow_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=127.0.0.1
      - DATABASE_PATH=/app/data/studyflow.sqlite

volumes:
  sqlite_data:
    driver: local
